apiVersion: batch/v1
kind: CronJob
metadata:
  name: tempo-secret-sync
  namespace: observability
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 180

      template:
        spec:
          serviceAccountName: tempo-secret-sync
          restartPolicy: Never

          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault

          containers:
            - name: sync
              # Mirror and pin an approved image in disconnected environments.
              image: registry.redhat.io/openshift4/ose-cli:v4.18
              imagePullPolicy: IfNotPresent

              command:
                - /bin/sh
                - -ec

              args:
                - |
                  set +x

                  echo "Checking OBC resources..."

                  oc get secret "${SOURCE_SECRET}" \
                    -n "${POD_NAMESPACE}" >/dev/null

                  oc get configmap "${SOURCE_CONFIGMAP}" \
                    -n "${POD_NAMESPACE}" >/dev/null

                  # Read credentials without printing their values.
                  ACCESS_KEY_ID="$(
                    oc get secret "${SOURCE_SECRET}" \
                      -n "${POD_NAMESPACE}" \
                      -o 'jsonpath={.data.AWS_ACCESS_KEY_ID}' |
                    base64 -d
                  )"

                  ACCESS_KEY_SECRET="$(
                    oc get secret "${SOURCE_SECRET}" \
                      -n "${POD_NAMESPACE}" \
                      -o 'jsonpath={.data.AWS_SECRET_ACCESS_KEY}' |
                    base64 -d
                  )"

                  BUCKET_NAME="$(
                    oc get configmap "${SOURCE_CONFIGMAP}" \
                      -n "${POD_NAMESPACE}" \
                      -o 'jsonpath={.data.BUCKET_NAME}'
                  )"

                  BUCKET_HOST="$(
                    oc get configmap "${SOURCE_CONFIGMAP}" \
                      -n "${POD_NAMESPACE}" \
                      -o 'jsonpath={.data.BUCKET_HOST}'
                  )"

                  BUCKET_PORT="$(
                    oc get configmap "${SOURCE_CONFIGMAP}" \
                      -n "${POD_NAMESPACE}" \
                      -o 'jsonpath={.data.BUCKET_PORT}'
                  )"

                  if [ -z "${ACCESS_KEY_ID}" ] ||
                     [ -z "${ACCESS_KEY_SECRET}" ] ||
                     [ -z "${BUCKET_NAME}" ] ||
                     [ -z "${BUCKET_HOST}" ]; then
                    echo "ERROR: Required OBC fields are missing." >&2
                    echo "Check the source Secret and ConfigMap key names." >&2
                    exit 1
                  fi

                  if [ -n "${BUCKET_PORT}" ]; then
                    ENDPOINT="${TLS_SCHEME}://${BUCKET_HOST}:${BUCKET_PORT}"
                  else
                    ENDPOINT="${TLS_SCHEME}://${BUCKET_HOST}"
                  fi

                  echo "Creating/updating destination Secret..."

                  oc create secret generic "${TARGET_SECRET}" \
                    -n "${POD_NAMESPACE}" \
                    --from-literal=endpoint="${ENDPOINT}" \
                    --from-literal=bucket="${BUCKET_NAME}" \
                    --from-literal=access_key_id="${ACCESS_KEY_ID}" \
                    --from-literal=access_key_secret="${ACCESS_KEY_SECRET}" \
                    --dry-run=client \
                    -o yaml |
                  oc apply -f -

                  unset ACCESS_KEY_ID ACCESS_KEY_SECRET

                  echo "Destination Secret sync completed."

              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace

                - name: SOURCE_SECRET
                  value: tempo-traces

                - name: SOURCE_CONFIGMAP
                  value: tempo-traces

                - name: TARGET_SECRET
                  value: tempo-storage

                # Confirm the actual endpoint scheme in your environment.
                - name: TLS_SCHEME
                  value: https

              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi

              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true



---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: tempo-secret-sync
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tempo-secret-sync
  namespace: observability
rules:
  # Read the OBC-generated Secret.
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tempo-secret-sync
  namespace: observability
subjects:
  - kind: ServiceAccount
    name: tempo-secret-sync
    namespace: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tempo-secret-sync