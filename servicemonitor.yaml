# OPTIONAL. Verify Collector Service labels and metrics port before applying.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-collector
  namespace: observability
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
    - port: prometheus
      interval: 30s
      path: /metrics
